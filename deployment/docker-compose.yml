# Local development stack: PostgreSQL + PostGIS, Redis, backend API, the ingest worker
# (reads GDACS, news feeds and ReliefWeb into public signals), frontend (console and the
# public site), and Mailpit (catches emails).
# Run from the repository root:  docker compose -f deployment/docker-compose.yml up --build
name: carcux

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: carcux
      POSTGRES_PASSWORD: carcux        # development only
      POSTGRES_DB: carcux
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carcux -d carcux"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    environment:
      CARCUX_ENVIRONMENT: development
      CARCUX_DATABASE_URL: postgresql+psycopg://carcux:carcux@db:5432/carcux
      CARCUX_REDIS_URL: redis://redis:6379/0
      CARCUX_MEDIA_DIR: /app/media
      CARCUX_RELIEFWEB_APPNAME: ${CARCUX_RELIEFWEB_APPNAME:-}
      # Public site emails (account confirmation) go to Mailpit: read them at
      # http://localhost:8025. In production, point these at a real SMTP server.
      CARCUX_PUBLIC_BASE_URL: http://localhost:3000
      CARCUX_SMTP_HOST: mailpit
      CARCUX_SMTP_PORT: "1025"
      CARCUX_SMTP_STARTTLS: "false"
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  # Catches every email in development; web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest  # development only
    ports:
      - "8025:8025"

  # Reads enabled sources on their schedules. Needs internet access.
  ingest:
    build: ../backend
    command: ["python", "-m", "app.cli", "ingest", "--loop"]
    environment:
      CARCUX_ENVIRONMENT: development
      CARCUX_DATABASE_URL: postgresql+psycopg://carcux:carcux@db:5432/carcux
      # Optional: an approved ReliefWeb app name, then enable ReliefWeb on the Sources page.
      CARCUX_RELIEFWEB_APPNAME: ${CARCUX_RELIEFWEB_APPNAME:-}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ../frontend
    environment:
      CARCUX_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  media_data:
