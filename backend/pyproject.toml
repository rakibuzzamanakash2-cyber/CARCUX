[project]
name = "carcux-backend"
version = "0.9.0"
description = "CARCUX backend API: field reports, public signals, events, evidence, audit"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "numpy>=1.26",  # event suggestions: features and logistic regression
    "openpyxl>=3.1",  # blind label sheets for remote annotators
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "jsonschema>=4.23",  # tests validate exports with data/tools
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.extraction" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test credentials are not secrets
# A copy of ai/extraction (pattern tables), linted and formatted there.
"app/extraction/claims.py" = ["E501"]
# A copy of ai/media: runs the tesseract program with a fixed argument list, no shell.
"app/media_features/ocr.py" = ["S603", "S607"]
