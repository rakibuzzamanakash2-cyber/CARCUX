name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carcux
          POSTGRES_PASSWORD: carcux
          POSTGRES_DB: carcux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carcux -d carcux_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARCUX_TEST_DATABASE_URL: postgresql+psycopg://carcux:carcux@localhost:5432/carcux_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Migrations match models
        env:
          CARCUX_DATABASE_URL: postgresql+psycopg://carcux:carcux@localhost:5432/carcux_test
        run: alembic upgrade head && alembic check
      - name: Test
        run: pytest -q

  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/tools
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/tools/pyproject.toml
      - name: No project folder is git-ignored
        working-directory: .
        run: |
          bad=$(git ls-files | xargs -n1 dirname | sort -u | while read -r d; do
            if git check-ignore -q --no-index "$d/__probe__.py"; then echo "$d"; fi
          done)
          if [ -n "$bad" ]; then
            echo "New files in these folders would be silently ignored by git:"; echo "$bad"; exit 1
          fi
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Validator tests
        run: pytest -q
      - name: Validate every dataset in the repository
        run: |
          for d in $(find ../samples ../releases -name events.jsonl -printf '%h\n' 2>/dev/null | sort -u); do
            python -m carcux_data.validate "$d"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
