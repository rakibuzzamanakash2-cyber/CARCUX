[project]
name = "carcux-fusion"
version = "0.1.0"
description = "CARCUX module 3: evidence under conflict: dependence, reliability, calibrated assessment (RQ2-RQ5)"
requires-python = ">=3.12"
# Also needs carcux-correlation (../correlation) for text similarity and report templates:
#   pip install -e ../../data/tools -e ../correlation -e ".[dev]"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
figures = ["matplotlib>=3.8"]  # reliability diagrams (calibrate --figures)

[project.scripts]
carcux-fusion = "carcux_fusion.evaluate:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carcux_fusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"carcux_fusion/simulate.py" = ["S311"]  # simulation, not cryptography

[tool.ruff.lint.isort]
known-first-party = ["carcux_fusion", "carcux_correlation", "carcux_data"]
