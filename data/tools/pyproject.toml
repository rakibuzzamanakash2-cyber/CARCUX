[project]
name = "carcux-data"
version = "0.1.0"
description = "CARCUX-BD dataset tools: schema validation, and the CARCUX-J24 fact-check indexer"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carcux_data*"]

[tool.setuptools.package-data]
"carcux_data.j24" = ["outlets.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
